<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgM" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fde4f1"/>
      <stop offset="100%" stop-color="#f9c6e0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a5a3b"/>
      <stop offset="100%" stop-color="#5e3a24"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#bgM)"/>
  <circle cx="200" cy="200" r="188" fill="none" stroke="#f49ac8" stroke-width="6"/>
  <!-- hearts & sparkles -->
  <g fill="#ec4899" opacity="0.9">
    <path d="M70 120c-8-10-24-6-24 8 0 10 14 18 24 26 10-8 24-16 24-26 0-14-16-18-24-8z"/>
    <path d="M330 150c-6-8-18-4-18 6 0 8 10 13 18 19 8-6 18-11 18-19 0-10-12-14-18-6z"/>
  </g>
  <g fill="#fbbf24">
    <path d="M300 95l5 14 14 5-14 5-5 14-5-14-14-5 14-5z"/>
    <path d="M110 300l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
  </g>
  <!-- hair back -->
  <path d="M120 150c0-55 40-95 80-95s80 40 80 95c6 60 2 120-10 150-20-10-40-14-70-14s-50 4-70 14c-12-30-16-90-10-150z" fill="url(#hair)"/>
  <!-- bow -->
  <g fill="#f472b6">
    <path d="M200 50c-22-22-60-10-60 16 0 14 18 22 40 20-16 8-18 26 0 30 10 2 18-6 20-16 2 10 10 18 20 16 18-4 16-22 0-30 22 2 40-6 40-20 0-26-38-38-60-16z"/>
    <circle cx="200" cy="66" r="9" fill="#ec4899"/>
  </g>
  <!-- face -->
  <ellipse cx="200" cy="175" rx="58" ry="66" fill="#ffe3d3"/>
  <!-- cheeks -->
  <circle cx="165" cy="190" r="12" fill="#f9a8d4" opacity="0.7"/>
  <circle cx="235" cy="190" r="12" fill="#f9a8d4" opacity="0.7"/>
  <!-- eyes -->
  <path d="M168 160q10 -10 22 0" stroke="#4a2c1a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="228" cy="162" r="7" fill="#4a2c1a"/>
  <!-- brows -->
  <path d="M166 146q11 -6 24 -2" stroke="#6b4228" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M214 144q12 -4 24 2" stroke="#6b4228" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- lips -->
  <path d="M188 200q12 10 24 0q-12 16 -24 0z" fill="#e8537f"/>
  <!-- brush -->
  <g transform="rotate(-18 150 250)">
    <rect x="120" y="230" width="14" height="70" rx="6" fill="#d97aa8"/>
    <ellipse cx="127" cy="226" rx="16" ry="22" fill="#f6c6dd"/>
  </g>
  <!-- lipstick -->
  <g>
    <rect x="252" y="250" width="20" height="46" rx="4" fill="#f4a6c4"/>
    <rect x="256" y="234" width="12" height="20" rx="3" fill="#e8537f"/>
  </g>
  <!-- banner -->
  <rect x="80" y="320" width="240" height="46" rx="23" fill="#f9c6e0" stroke="#ec4899" stroke-width="3"/>
  <text x="200" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#8a3a63">Maquillaje</text>
</svg>
